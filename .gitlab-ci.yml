stages:
  - build

variables:
  PIXI_HOME: "$CI_PROJECT_DIR/.pixi-home"

cache:
  key:
    files:
      - pixi.lock
  paths:
    - .pixi
    - .pixi-home

default:
  tags:
    - py3.8
  before_script:
    - curl -fsSL https://pixi.sh/install.sh | bash
    - export PATH="$PIXI_HOME/bin:$PATH"

test:
  stage: build
  script:
    - pixi run --locked lint
    - pixi run --locked test
    - pixi run --locked -e test-py310 test

build-docs:
  stage: build
  script:
    - pixi run --locked -e docs docs-build
    - cp -r site /home/wwwslapdocs/public/slapdash
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
